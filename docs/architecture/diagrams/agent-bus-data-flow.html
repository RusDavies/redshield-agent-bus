<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redshield Agent Bus - Data Flow</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    max-width: 1100px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 650;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.6;
    fill: none;
  }
  .edge-risk {
    stroke: #b91c1c;
    stroke-width: 1.8;
    stroke-dasharray: 7 5;
    fill: none;
  }
</style>
<main>
  <svg viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
    <title id="title">Redshield Agent Bus data flow</title>
    <desc id="desc">Data flow from source surface through source agent, agent bus validation, queue, target agent, state/audit stores, and delivery adapters.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
      <marker id="arrow-risk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" />
      </marker>
    </defs>

    <text class="title" x="40" y="46">Redshield Agent Bus - Initial Data Flow</text>
    <text class="small" x="40" y="70">First slice: one source agent creates one typed bus message for one target agent or role.</text>

    <path class="edge" marker-end="url(#arrow)" d="M 190 150 C 235 150, 245 150, 290 150" />
    <path class="edge" marker-end="url(#arrow)" d="M 430 150 C 470 150, 480 150, 520 150" />
    <path class="edge" marker-end="url(#arrow)" d="M 700 150 C 740 150, 750 150, 790 150" />
    <path class="edge" marker-end="url(#arrow)" d="M 930 150 C 975 150, 985 150, 1030 150" />

    <path class="edge" marker-end="url(#arrow)" d="M 610 220 L 610 285" />
    <path class="edge" marker-end="url(#arrow)" d="M 610 405 L 610 470" />
    <path class="edge" marker-end="url(#arrow)" d="M 790 520 C 855 520, 870 325, 950 285" />
    <path class="edge" marker-end="url(#arrow)" d="M 520 520 C 450 520, 410 345, 340 275" />

    <path class="edge" marker-end="url(#arrow)" d="M 410 355 C 465 355, 475 355, 530 355" />
    <path class="edge" marker-end="url(#arrow)" d="M 690 355 C 745 355, 755 355, 810 355" />
    <path class="edge" marker-end="url(#arrow)" d="M 880 425 C 830 470, 780 490, 720 505" />
    <path class="edge" marker-end="url(#arrow)" d="M 520 560 C 420 585, 300 565, 210 520" />
    <path class="edge-risk" marker-end="url(#arrow-risk)" d="M 520 420 C 430 445, 350 445, 260 420" />

    <rect class="node input" x="40" y="115" width="150" height="70" rx="8" />
    <text class="label" x="62" y="145">Source Surface</text>
    <text class="small" x="62" y="166">chat/workspace</text>

    <rect class="node process" x="290" y="105" width="140" height="90" rx="8" />
    <text class="label" x="315" y="138">Source Agent</text>
    <text class="small" x="315" y="160">builds scoped</text>
    <text class="small" x="315" y="177">message envelope</text>

    <rect class="node process" x="520" y="95" width="180" height="110" rx="8" />
    <text class="label" x="550" y="130">Agent Bus</text>
    <text class="small" x="550" y="152">validates envelope</text>
    <text class="small" x="550" y="169">sets timestamps</text>
    <text class="small" x="550" y="186">routes or rejects</text>

    <rect class="node process" x="790" y="105" width="140" height="90" rx="8" />
    <text class="label" x="815" y="138">Target Agent</text>
    <text class="small" x="815" y="160">claims and acts</text>
    <text class="small" x="815" y="177">within authority</text>

    <rect class="node input" x="1030" y="115" width="50" height="70" rx="8" />
    <text class="label" x="1042" y="146">Result</text>
    <text class="small" x="1040" y="166">path</text>

    <rect class="node process" x="530" y="285" width="160" height="120" rx="8" />
    <text class="label" x="555" y="320">Validation</text>
    <text class="small" x="555" y="342">provenance</text>
    <text class="small" x="555" y="359">authorization</text>
    <text class="small" x="555" y="376">idempotency</text>

    <rect class="node storage" x="250" y="305" width="160" height="100" rx="8" />
    <text class="label" x="283" y="340">Context</text>
    <text class="small" x="283" y="362">scoped package</text>
    <text class="small" x="283" y="379">refs, not dumps</text>

    <rect class="node storage" x="810" y="305" width="160" height="100" rx="8" />
    <text class="label" x="845" y="340">State</text>
    <text class="small" x="845" y="362">claim/work/result</text>
    <text class="small" x="845" y="379">append-only</text>

    <rect class="node storage" x="520" y="470" width="200" height="100" rx="8" />
    <text class="label" x="560" y="505">Audit Evidence</text>
    <text class="small" x="560" y="527">hashes, receipts,</text>
    <text class="small" x="560" y="544">decisions, redactions</text>

    <rect class="node external" x="40" y="485" width="170" height="80" rx="8" />
    <text class="label" x="68" y="518">Delivery Adapter</text>
    <text class="small" x="68" y="540">visible/private/file</text>

    <rect class="node risk" x="60" y="385" width="200" height="70" rx="8" />
    <text class="label" x="83" y="415">Reject Unsafe</text>
    <text class="small" x="83" y="436">missing auth/provenance</text>

    <rect class="node neutral" x="790" y="485" width="185" height="75" rx="8" />
    <text class="label" x="820" y="516">Completion</text>
    <text class="small" x="820" y="538">result + receipt</text>

    <rect class="node neutral" x="40" y="610" width="130" height="36" rx="6" />
    <text class="small" x="56" y="633">Input / surface</text>
    <rect class="node process" x="190" y="610" width="130" height="36" rx="6" />
    <text class="small" x="207" y="633">Process</text>
    <rect class="node storage" x="340" y="610" width="130" height="36" rx="6" />
    <text class="small" x="357" y="633">Stored evidence</text>
    <rect class="node risk" x="490" y="610" width="130" height="36" rx="6" />
    <text class="small" x="507" y="633">Rejection/risk</text>
  </svg>
</main>
