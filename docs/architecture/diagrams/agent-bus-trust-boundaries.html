<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redshield Agent Bus - Trust Boundaries</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    max-width: 1100px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 650;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.6;
    fill: none;
  }
  .edge-risk {
    stroke: #b91c1c;
    stroke-width: 1.8;
    stroke-dasharray: 7 5;
    fill: none;
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.4;
    stroke-dasharray: 8 6;
    opacity: 0.85;
  }
</style>
<main>
  <svg viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
    <title id="title">Redshield Agent Bus trust boundaries</title>
    <desc id="desc">Trust boundaries around source surfaces, agent runtimes, the bus core, policy and enforcement services, storage, and external integrations.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
      <marker id="arrow-risk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" />
      </marker>
    </defs>

    <text class="title" x="40" y="46">Redshield Agent Bus - Trust Boundaries</text>
    <text class="small" x="40" y="70">Dashed boxes are trust zones. Red dashed connectors are high-risk boundary crossings.</text>

    <rect class="zone" x="30" y="100" width="210" height="470" rx="12" />
    <text class="small" x="52" y="126">Untrusted / semi-trusted surfaces</text>

    <rect class="zone" x="275" y="100" width="200" height="470" rx="12" />
    <text class="small" x="298" y="126">Agent runtime zone</text>

    <rect class="zone" x="510" y="100" width="250" height="470" rx="12" />
    <text class="small" x="535" y="126">Agent Bus control plane</text>

    <rect class="zone" x="795" y="100" width="270" height="470" rx="12" />
    <text class="small" x="820" y="126">Policy, enforcement, and evidence</text>

    <path class="edge-risk" marker-end="url(#arrow-risk)" d="M 220 195 C 245 195, 260 195, 285 195" />
    <path class="edge-risk" marker-end="url(#arrow-risk)" d="M 430 195 C 465 195, 490 195, 525 195" />
    <path class="edge" marker-end="url(#arrow)" d="M 695 195 C 725 195, 750 195, 815 195" />
    <path class="edge" marker-end="url(#arrow)" d="M 650 270 C 700 310, 760 320, 820 325" />
    <path class="edge" marker-end="url(#arrow)" d="M 650 380 C 705 410, 760 425, 820 430" />
    <path class="edge-risk" marker-end="url(#arrow-risk)" d="M 640 500 C 560 610, 280 610, 150 535" />
    <path class="edge-risk" marker-end="url(#arrow-risk)" d="M 420 325 C 465 325, 500 325, 545 325" />
    <path class="edge-risk" marker-end="url(#arrow-risk)" d="M 420 440 C 465 440, 500 440, 545 440" />

    <rect class="node input" x="60" y="155" width="160" height="80" rx="8" />
    <text class="label" x="90" y="188">Chat Surface</text>
    <text class="small" x="90" y="210">requests, results,</text>
    <text class="small" x="90" y="227">visible delivery</text>

    <rect class="node external" x="60" y="290" width="160" height="80" rx="8" />
    <text class="label" x="88" y="323">Workspace</text>
    <text class="small" x="88" y="345">project files, refs,</text>
    <text class="small" x="88" y="362">source context</text>

    <rect class="node risk" x="60" y="455" width="160" height="80" rx="8" />
    <text class="label" x="82" y="488">External APIs</text>
    <text class="small" x="82" y="510">public/customer</text>
    <text class="small" x="82" y="527">side effects</text>

    <rect class="node process" x="285" y="155" width="145" height="80" rx="8" />
    <text class="label" x="315" y="188">Source Agent</text>
    <text class="small" x="315" y="210">creates envelope</text>

    <rect class="node process" x="285" y="285" width="145" height="80" rx="8" />
    <text class="label" x="315" y="318">Target Agent</text>
    <text class="small" x="315" y="340">claims work</text>

    <rect class="node process" x="285" y="400" width="145" height="80" rx="8" />
    <text class="label" x="314" y="433">Tool Adapter</text>
    <text class="small" x="314" y="455">bounded action</text>

    <rect class="node process" x="545" y="145" width="150" height="100" rx="8" />
    <text class="label" x="575" y="178">Bus Core</text>
    <text class="small" x="575" y="200">validate, route,</text>
    <text class="small" x="575" y="217">state transition</text>

    <rect class="node process" x="545" y="285" width="150" height="80" rx="8" />
    <text class="label" x="574" y="318">Resolver</text>
    <text class="small" x="574" y="340">target/project</text>

    <rect class="node process" x="545" y="400" width="150" height="80" rx="8" />
    <text class="label" x="574" y="433">Delivery</text>
    <text class="small" x="574" y="455">receipt or failure</text>

    <rect class="node storage" x="545" y="515" width="150" height="45" rx="8" />
    <text class="label" x="575" y="543">Audit Log</text>

    <rect class="node external" x="820" y="150" width="190" height="90" rx="8" />
    <text class="label" x="850" y="183">RedshieldWarden</text>
    <text class="small" x="850" y="205">policy/governance</text>
    <text class="small" x="850" y="222">future integration</text>

    <rect class="node risk" x="820" y="285" width="190" height="90" rx="8" />
    <text class="label" x="850" y="318">RedshieldArmor</text>
    <text class="small" x="850" y="340">runtime enforcement</text>
    <text class="small" x="850" y="357">future integration</text>

    <rect class="node storage" x="820" y="400" width="190" height="90" rx="8" />
    <text class="label" x="850" y="433">Evidence Store</text>
    <text class="small" x="850" y="455">controls, receipts,</text>
    <text class="small" x="850" y="472">redactions</text>

    <rect class="node external" x="820" y="520" width="190" height="80" rx="8" />
    <text class="label" x="850" y="553">Open Source /</text>
    <text class="label" x="850" y="571">Enterprise Boundary</text>

    <text class="small" x="52" y="635">High-risk boundaries: untrusted surfaces to agents, agents to bus, agents/tools to bus, bus delivery to surfaces/external APIs.</text>
    <text class="small" x="52" y="657">Controls: authenticated agents, explicit authorization context, deterministic resolver, delivery receipts, audit redaction, policy/enforcement hooks.</text>
  </svg>
</main>
